[project]
name = "companion-ai-api"
version = "0.1.0"
description = "Persistent memory and persona-consistency core for Companion AI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "openai>=1.99,<3",
  "orjson>=3.10,<4",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "pyyaml>=6,<7",
  "redis>=6,<7",
  "sqlalchemy>=2.0.40,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=5,<6",
]
dev = [
  "fakeredis>=2.30,<3",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]

[project.scripts]
companion = "companion.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations"]
