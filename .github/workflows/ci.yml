name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --extra dev
      - run: uv run --package companion-ai-api ruff check apps/api
      - run: uv run --package companion-ai-api mypy apps/api/src
      - run: uv run --package companion-ai-api pytest apps/api/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @companion/web lint
      - run: pnpm --filter @companion/web typecheck
      - run: pnpm --filter @companion/web test
