name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: companion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d companion_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/apps/api/src
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/companion_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/companion_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --extra dev
      - name: Enable pgvector in ephemeral CI database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d companion_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'
      - run: uv run --directory apps/api alembic upgrade head
      - run: uv run --directory apps/api alembic check
      - run: uv run --package companion-ai-api ruff check apps/api
      - run: uv run --package companion-ai-api mypy apps/api/src
      - run: uv run --package companion-ai-api pytest apps/api/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @companion/web lint
      - run: pnpm --filter @companion/web typecheck
      - run: pnpm --filter @companion/web test
      - run: pnpm --filter @companion/web build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: uv sync --all-packages --extra dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @companion/web exec playwright install --with-deps chromium
      - run: pnpm --filter @companion/web test:e2e
